
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرائت‌یار</title>
<style>
* {
  box-sizing: border-box;
}
body {
  font-family: Tahoma, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 18px;
  text-align: center;
  color: #263238;
}
header {
  background: #087e73;
  color: white;
  padding: 25px;
  border-radius: 15px;
}
.card {
  background: white;
  padding: 20px;
  margin-top: 18px;
  border-radius: 15px;
  box-shadow: 0 3px 10px #00000010;
}
button {
  background: #087e73;
  color: white;
  border: 0;
  padding: 13px 22px;
  border-radius: 9px;
  margin: 6px;
  font-size: 16px;
}
</style>
</head>
<body>

<header>
<h1>قرائت‌یار</h1>
<p>سامانه مدیریت قرائت کنتور آب</p>
</header>

<div class="card">
<h2>خوش آمدید</h2>
<p>مدیریت مشترکین و قرائت روستاها</p>
<button onclick="alert('به قرائت‌یار خوش آمدید')">
شروع کار
</button>
</div>

<div class="card">
<h3>امکانات سامانه</h3>
<p>ثبت مشترکین</p>
<p>جست‌وجو با شماره اشتراک</p>
<p>جست‌وجو با نام و نام خانوادگی</p>
<p>ثبت دوره‌های قرائت</p>
<p>گزارش مصرف آب</p>
</div>

</body>
</html>
